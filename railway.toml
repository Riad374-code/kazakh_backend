# Khudaferin - Railway service configuration
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# uvicorn reads Railway's injected PORT env var automatically.
startCommand = "python run.py"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[variables]
# Writable location of the SQLite operational store (recreated from
# checkpoints on every fresh boot). For persistence attach a Railway Volume
# mounted at /data and set DATABASE_PATH=/data/kazakh_ai.db
DATA_DIR = "/app/data"
REFRESH_INTERVAL_SECONDS = "3600"
# Comma-separated list of frontend origins. Leave "*" for wide-open demo CORS.
CORS_ORIGINS = "*"

dataset_version: 0.1.0
seed: 42
regions:
- name: example_placeholder_region
  min_lon: 50.0
  min_lat: 43.0
  max_lon: 54.0
  max_lat: 46.0
  country: []
date_start: '2024-01-01'
date_end: '2024-01-02'
scene_search:
  product_type: GRD
  polarizations:
  - VV
  orbit_directions:
  - ASCENDING
  - DESCENDING
  max_results: 10
tile:
  size_px: 256
  overlap_px: 0
  target_crs: EPSG:4326
  min_valid_water_percent: 0.0
weather_variables: []
ocean_variables: []
observations:
- reanalysis
- observation
negative_sampling_ratio: 1.0
split_strategy: group_by_scene
split_test_holdout: 0.2
split_val_holdout: 0.2
resampling_method: bilinear
mask_resampling_method: nearest
ontology_path: configs\label_ontology.yaml
rate_limit:
  requests_per_minute: 30
  max_concurrent_requests: 4
retry:
  max_attempts: 3
  base_delay_seconds: 2.0
  max_delay_seconds: 120.0
  backoff_factor: 2.0
  http_timeout_seconds: 30.0
paths:
  base: data
  raw: raw
  interim: interim
  processed: processed
  manifests: manifests
  reports: reports
  cache: cache
  quarantine: quarantine
compression:
  coerce_default: true
  gdal_profile: GeoTIFF
  compression: DEFLATE
  z_level: 6
quality:
  weather_delta_minutes: 90
  ocean_delta_minutes: 90
  max_warnings: 20
  min_coverage_fraction: 0.5
logging:
  level: INFO
  log_dir: logs
licence_on_incompatible: warn

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marine-dataset"
version = "0.1.0"
description = "Reproducible pipeline for building a multimodal marine pollution and oil-spill detection dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Marine Dataset contributors" }]
keywords = ["geospatial", "sentinel", "marine", "oil-spill", "remote-sensing", "dataset"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.scripts]
marine-data = "marine_dataset.cli:app"

[project.optional-dependencies]
runtime = [
    "pydantic>=2.5,<3",
    "PyYAML>=6.0",
    "requests>=2.31",
]

geo = [
    "rasterio>=1.3",
    "geopandas>=0.14",
]

ml = [
    "numpy>=1.26",
]

dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marine_dataset"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires external credentials/network (deselected by default)",
    "live: requires live provider verification",
]
addopts = "-m 'not integration and not live' --basetemp=.pytest_tmp"